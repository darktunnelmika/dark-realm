name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Validate tag and source
        shell: bash
        run: |
          set -euo pipefail
          bash -n dark-realm.sh install.sh tests/test.sh
          ./tests/test.sh
          version="$(sed -n 's/^SCRIPT_VER="\([^"]*\)"/\1/p' dark-realm.sh | head -n1)"
          test "v${version}" = "${GITHUB_REF_NAME}"

      - name: Build release archive
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          dir="DARK-REALM-PRO-v${version}"
          mkdir "$dir"
          cp dark-realm.sh install.sh README.md README.en.md README.fa.md CHANGELOG.md LICENSE SECURITY.md "$dir/"
          cp -R tests "$dir/"
          tar -czf "${dir}.tar.gz" "$dir"
          sha256sum "${dir}.tar.gz" > SHA256SUMS

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            "DARK-REALM-PRO-${GITHUB_REF_NAME}.tar.gz" SHA256SUMS \
            --title "DARK REALM PRO ${GITHUB_REF_NAME}" \
            --generate-notes
