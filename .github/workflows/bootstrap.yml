name: Bootstrap DARK REALM PRO

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/bootstrap.yml"

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore verified source archive
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap/part00 .bootstrap/part01 .bootstrap/part02 \
              .bootstrap/part03 .bootstrap/part04 .bootstrap/part05 \
              > /tmp/dark-realm-source.b64
          base64 -d /tmp/dark-realm-source.b64 > /tmp/dark-realm-src.tar.xz
          echo "95b70d443b2655dade9b4d20515689a6ad41add9a0eeb143c3767ff9ec9981fa  /tmp/dark-realm-src.tar.xz" | sha256sum -c -
          mkdir -p /tmp/dark-realm-source
          tar -xJf /tmp/dark-realm-src.tar.xz -C /tmp/dark-realm-source
          cp -a /tmp/dark-realm-source/. .

          # OpenSSL 3.0 on some distributions prints a hostname mismatch while
          # returning status 0. Make SAN validation depend on the canonical
          # positive output so production and CI behave identically.
          python3 - <<'PY'
          from pathlib import Path
          path = Path("dark-realm.sh")
          source = path.read_text()
          old = '''cert_matches_host() {
            local cert="$1" host="$2"
            openssl x509 -in "$cert" -noout -checkhost "$host" >/dev/null 2>&1
          }
          '''
          new = '''cert_matches_host() {
            local cert="$1" host="$2" output
            # OpenSSL 3.0 on some distributions prints a hostname mismatch while still
            # returning status 0. Parse the canonical positive result instead of trusting
            # the process exit code so SAN validation behaves consistently everywhere.
            output="$(openssl x509 -in "$cert" -noout -checkhost "$host" 2>&1 || true)"
            printf '%s\\n' "$output" | grep -Fq 'does match certificate'
          }
          '''
          if old not in source:
              raise SystemExit("certificate validation function was not found")
          path.write_text(source.replace(old, new, 1))
          PY

          # Workflow files are committed separately through the authorized
          # GitHub connection after this source transaction succeeds.
          rm -f .github/workflows/ci.yml .github/workflows/release.yml
          rm -rf .bootstrap
          chmod +x dark-realm.sh install.sh tests/test.sh

      - name: Validate manager and regression suite
        shell: bash
        run: |
          set -euo pipefail
          bash -n dark-realm.sh install.sh tests/test.sh
          ./tests/test.sh

      - name: Publish source transaction
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: release DARK REALM PRO v1.0.0"
          git push origin HEAD:main
